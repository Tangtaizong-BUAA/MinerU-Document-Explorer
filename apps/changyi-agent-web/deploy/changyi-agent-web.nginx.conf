# Dedicated Changyi Jiuan online Agent. The exact prefix prevents overlap with
# the existing MCP route at /cyj/mcp and every unrelated site route.
location = /cyj/agent {
    return 308 /cyj/agent/;
}

location ^~ /cyj/agent/ {
    auth_basic "Changyi Jiuan Team";
    auth_basic_user_file /etc/nginx/.htpasswd-changyi-agent;

    proxy_pass http://127.0.0.1:8801;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # The server accepts files up to 8 MiB; leave transport headroom for
    # request framing while keeping this route sharply bounded.
    client_max_body_size 12m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
