spec: changyi-jiuan-mcp-surface
version: 0.2.0
status: draft

primary_clients:
  - name: Qoder
    default_transport: stdio
  - name: Hermes Agent
    default_transport: stdio
    optional_transport: localhost_http
  - name: Codex
    default_transport: stdio

profiles:
  upstream-full:
    purpose: upstream compatibility and development
    tools: upstream_all
  project-read:
    purpose: query subagent knowledge access
    tools: [kb_brief, kb_graph_context, kb_lookup, kb_search, kb_outline, kb_read, kb_view]
  project-maintain:
    purpose: default orchestrator work lifecycle and automatic policy submission
    extends: project-read
    tools: [kb_start_work, kb_update_main, kb_upsert_section, kb_publish_resource, kb_capture_context, kb_finish_work]
  project-admin:
    purpose: agent-managed ingestion, reconciliation, rebuild, and operations
    extends: project-maintain
    tools: [kb_bootstrap_project, kb_configure_source_root, kb_ingest, kb_parse_artifact, kb_reconcile_memory, kb_maintain]

resource_templates:
  - "kb://project/{project_id}/brief"
  - "kb://project/{project_id}/main"
  - "kb://record/{record_id}"
  - "kb://artifact/{artifact_id}"
  - "kb://artifact/{artifact_id}/page/{page}"
  - "kb://evidence/{evidence_id}"
  - "kb://work/{work_id}"
  - "kb://memory/{memory_id}"

tools:
  kb_bootstrap_project:
    profile: project-admin
    read_only: false
    idempotency_key: project_id
    required_input: [project_id, title, mission]
    rules:
      - "creates canonical Markdown project record only once"

  kb_configure_source_root:
    profile: project-admin
    read_only: false
    idempotency_key: id
    required_input: [id, project_id, relative_path]
    rules:
      - "absolute paths and CYJ_KB_ROOT itself are forbidden"
      - "configured root must remain under CYJ_KB_ROOT"

  kb_brief:
    profile: project-read
    read_only: true
    main_file: complete_and_untruncated
    required_input: [project_id]
    output: [main_file, navigation, graph, active_work, accepted_memory, generated_at]
    rules:
      - "must be the first project knowledge call"
      - "main file is orientation and navigation, not sufficient detail evidence"

  kb_lookup:
    profile: project-read
    read_only: true
    default_limit: 20
    hard_limit: 100
    required_input: [entity_type]
    optional_input: [filters, fields, limit, cursor]

  kb_search:
    profile: project-read
    read_only: true
    default_top_k: 5
    hard_top_k: 20
    default_snippet_tokens: 100
    hard_snippet_tokens: 250
    modes: [auto, exact, hybrid, semantic]
    required_input: [query]
    optional_input: [filters, mode, top_k, snippet_tokens, include_unverified]
    defaults:
      mode: auto
      include_unverified: false
    rules:
      - "agents proactively use detail RAG for names, numbers, dates, versions, exact wording, and evidence"
      - "results include directly linked artifact handles"

  kb_graph_context:
    profile: project-read
    read_only: true
    required_input: [node_id]
    optional_input: [query, depth, artifact_mode, max_nodes, max_artifacts, max_tokens]
    defaults:
      depth: 1
      artifact_mode: excerpt
      max_nodes: 30
      max_artifacts: 5
      max_tokens: 1800
    rules:
      - "graph is rebuilt from canonical record references"
      - "linked artifact excerpts are returned as MCP resources"

  kb_outline:
    profile: project-read
    read_only: true
    default_budget_tokens: 300
    hard_limit_tokens: 800
    required_input: [resource_id]
    optional_input: [depth, range]

  kb_read:
    profile: project-read
    read_only: true
    default_budget_tokens: 800
    hard_limit_tokens: 2000
    required_input: [resource_id]
    optional_input: [address, max_tokens, include_assets, cursor]
    defaults:
      include_assets: false
    rules:
      - "address required unless resource is below safe small-resource threshold"

  kb_view:
    profile: project-read
    read_only: true
    default_budget_tokens: 800
    hard_limit_tokens: 1200
    required_input: [project_id, view]
    views: [overview, timeline, people, deliverables, risks, quality]
    rules:
      - "views are rebuilt from canonical Markdown records"
      - "views must not become a second editable source of truth"

  kb_start_work:
    profile: project-maintain
    read_only: false
    required_input: [objective, expected_outputs, acceptance_criteria]
    optional_input: [input_refs]
    output: [work_id, knowledge_version, brief_uri, main_uri, closeout_requirements]

  kb_update_main:
    profile: project-maintain
    read_only: false
    idempotency_key: "project_id + revision_hash"
    required_input: [project_id, work_id, markdown, expected_revision, change_summary]
    optional_input: [source_refs]
    rules:
      - "requires an active same-project work item for a changed revision"
      - "stale expected revisions are rejected"
      - "previous main revisions are retained"
      - "main file stays stable and navigational; details belong in sections"

  kb_upsert_section:
    profile: project-maintain
    read_only: false
    idempotency_key: "project_id + key + revision_hash"
    required_input: [project_id, work_id, key, title, summary, markdown, change_summary]
    optional_input: [parent_ref, artifact_refs, related_refs, source_refs, expected_revision, confidentiality]
    rules:
      - "server generates the stable section ID"
      - "parent and artifact references must exist in the same project"
      - "stale expected revisions are rejected"
      - "main-to-section and section-to-artifact links are maintained automatically"

  kb_publish_resource:
    profile: project-maintain
    read_only: false
    required_input: [work_id, resource]
    rules:
      - "small text is searchable immediately"
      - "binary documents can be normalized with MinerU"
      - "Agent-generated resources are not automatically verified evidence"

  kb_capture_context:
    profile: project-maintain
    read_only: false
    required_input: [work_id, summary, updates]
    rules:
      - "stores distilled structured knowledge, never a raw transcript"
      - "server policy accepts, quarantines, or rejects each update"

  kb_finish_work:
    profile: project-maintain
    read_only: false
    idempotency_key: "work_id + result_hash"
    default_response_budget_tokens: 500
    hard_response_limit_tokens: 1000
    required_input: [work_id, outcome, summary, result_hash]
    optional_input: [artifacts, generated_resources, claims, decisions, lessons, knowledge_updates, unresolved, evidence_refs]
    outcomes: [completed, partial, failed, cancelled]
    output:
      - work_status
      - accepted_updates
      - promoted_memory_ids
      - quarantined_memory_ids
      - rejected_memory_ids
      - remediation_work_ids
      - validation_event_ids
      - policy_trace_id
      - audit_event_id

  kb_ingest:
    profile: project-admin
    read_only: false
    idempotency_key: "source_root_id + request_hash"
    required_input: [source_root_id, mode, request_hash]
    optional_input: [relative_paths, glob, parser_policy]
    modes: [inventory, ingest]
    rules:
      - "absolute paths are forbidden"
      - "source_root_id must be preconfigured"
      - "cloud parsing requires an enabled egress policy"
      - "current implementation is local inventory and artifact registration only"

  kb_parse_artifact:
    profile: project-admin
    read_only: false
    idempotency_key: "artifact_id + input_sha256 + mineru_api_policy_version"
    required_input: [artifact_id]
    rules:
      - "registered artifact must be a MinerU-supported PDF, image, Office, or spreadsheet file under a configured source root"
      - "MinerU credentials must be configured outside MCP input"
      - "each API egress attempt is appended to the audit log"
      - "failed parsing must not modify the original file"

  kb_reconcile_memory:
    profile: project-admin
    read_only: false
    idempotency_key: "memory_id + request_hash"
    required_input: [memory_id, action, rationale, request_hash]
    optional_input: [evidence_refs, narrowed_scope, proposed_supersedes]
    actions: [add_evidence, narrow_scope, propose_supersession, revalidate]
    rules:
      - "the caller cannot choose the final validation status"
      - "force_accept is forbidden"

  kb_maintain:
    profile: project-admin
    read_only: false
    idempotency_key: "action + scope + request_hash"
    required_input: [action, request_hash]
    optional_input: [scope, dry_run]
    actions: [health, lint, retry_failed_parses]
    defaults:
      dry_run: true
    rules:
      - "physical deletion of originals is forbidden"
      - "deletion of accepted history and audit events is forbidden"

response_contract:
  text_summary: required
  structured_content: required
  output_schema: required
  resource_links: preferred_for_large_content
  absolute_paths: forbidden
  secrets: forbidden

security_defaults:
  http_bind: 127.0.0.1
  remote_http_enabled: false
  unverified_visible_in_default_search: false
  candidate_visible_in_default_search: false
  write_tools_visible_to_read_profile: false
  force_accept_available: false
  physical_original_delete_available: false

autonomy_contract:
  human_approval_in_normal_path: false
  finish_work_required: true
  policy_decision_required_for_promotion: true
  unresolved_action: quarantine_and_create_remediation_work
  policy_failure_action: fail_closed
