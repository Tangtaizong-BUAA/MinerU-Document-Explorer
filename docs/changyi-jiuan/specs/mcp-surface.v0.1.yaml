spec: changyi-jiuan-mcp-surface
version: 0.1.1
status: draft

primary_clients:
  - name: Qoder
    default_transport: stdio
  - name: Hermes Agent
    default_transport: stdio
    optional_transport: localhost_http
  - name: Codex
    default_transport: stdio

profiles:
  upstream-full:
    purpose: upstream compatibility and development
    tools: upstream_all
  project-read:
    purpose: query subagent knowledge access
    tools: [kb_brief, kb_lookup, kb_search, kb_outline, kb_read, kb_view]
  project-maintain:
    purpose: default orchestrator work lifecycle and automatic policy submission
    extends: project-read
    tools: [kb_start_work, kb_finish_work]
  project-admin:
    purpose: agent-managed ingestion, reconciliation, rebuild, and operations
    extends: project-maintain
    tools: [kb_ingest, kb_reconcile_memory, kb_maintain]

resource_templates:
  - "kb://project/{project_id}/brief"
  - "kb://record/{record_id}"
  - "kb://artifact/{artifact_id}"
  - "kb://artifact/{artifact_id}/page/{page}"
  - "kb://evidence/{evidence_id}"
  - "kb://work/{work_id}"
  - "kb://memory/{memory_id}"

tools:
  kb_brief:
    profile: project-read
    read_only: true
    default_budget_tokens: 600
    hard_limit_tokens: 1200
    required_input: [project_id]
    output: [brief_version, generated_at, sections, source_links]

  kb_lookup:
    profile: project-read
    read_only: true
    default_limit: 20
    hard_limit: 100
    required_input: [entity_type]
    optional_input: [filters, fields, limit, cursor]

  kb_search:
    profile: project-read
    read_only: true
    default_top_k: 5
    hard_top_k: 20
    default_snippet_tokens: 100
    hard_snippet_tokens: 250
    modes: [auto, exact, hybrid, semantic]
    required_input: [query]
    optional_input: [filters, mode, top_k, snippet_tokens, include_unverified]
    defaults:
      mode: auto
      include_unverified: false

  kb_outline:
    profile: project-read
    read_only: true
    default_budget_tokens: 300
    hard_limit_tokens: 800
    required_input: [resource_id]
    optional_input: [depth, range]

  kb_read:
    profile: project-read
    read_only: true
    default_budget_tokens: 800
    hard_limit_tokens: 2000
    required_input: [resource_id]
    optional_input: [address, max_tokens, include_assets, cursor]
    defaults:
      include_assets: false
    rules:
      - "address required unless resource is below safe small-resource threshold"

  kb_view:
    profile: project-read
    read_only: true
    default_budget_tokens: 800
    hard_limit_tokens: 1200
    required_input: [project_id, view]
    views: [overview, timeline, people, deliverables, risks, quality]
    rules:
      - "views are rebuilt from canonical Markdown records"
      - "views must not become a second editable source of truth"

  kb_start_work:
    profile: project-maintain
    read_only: false
    required_input: [objective, expected_outputs, acceptance_criteria]
    optional_input: [input_refs]
    output: [work_id, knowledge_version, brief_uri, closeout_requirements]

  kb_finish_work:
    profile: project-maintain
    read_only: false
    idempotency_key: "work_id + result_hash"
    default_response_budget_tokens: 500
    hard_response_limit_tokens: 1000
    required_input: [work_id, outcome, summary, result_hash]
    optional_input: [artifacts, claims, decisions, lessons, unresolved, evidence_refs]
    outcomes: [completed, partial, failed, cancelled]
    output:
      - work_status
      - accepted_updates
      - promoted_memory_ids
      - quarantined_memory_ids
      - rejected_memory_ids
      - remediation_work_ids
      - validation_event_ids
      - policy_trace_id
      - audit_event_id

  kb_ingest:
    profile: project-admin
    read_only: false
    idempotency_key: "source_root_id + request_hash"
    required_input: [source_root_id, mode, request_hash]
    optional_input: [relative_paths, glob, parser_policy]
    modes: [inventory, ingest, retry]
    rules:
      - "absolute paths are forbidden"
      - "source_root_id must be preconfigured"
      - "cloud parsing requires an enabled egress policy"

  kb_reconcile_memory:
    profile: project-admin
    read_only: false
    idempotency_key: "memory_id + request_hash"
    required_input: [memory_id, action, rationale, request_hash]
    optional_input: [evidence_refs, narrowed_scope, proposed_supersedes]
    actions: [add_evidence, narrow_scope, propose_supersession, revalidate]
    rules:
      - "the caller cannot choose the final validation status"
      - "force_accept is forbidden"

  kb_maintain:
    profile: project-admin
    read_only: false
    idempotency_key: "action + scope + request_hash"
    required_input: [action, request_hash]
    optional_input: [scope, dry_run]
    actions: [health, retry_quarantined, rebuild_derived, backup, verify_restore]
    defaults:
      dry_run: true
    rules:
      - "physical deletion of originals is forbidden"
      - "deletion of accepted history and audit events is forbidden"

response_contract:
  text_summary: required
  structured_content: required
  output_schema: required
  resource_links: preferred_for_large_content
  absolute_paths: forbidden
  secrets: forbidden

security_defaults:
  http_bind: 127.0.0.1
  remote_http_enabled: false
  unverified_visible_in_default_search: false
  candidate_visible_in_default_search: false
  write_tools_visible_to_read_profile: false
  force_accept_available: false
  physical_original_delete_available: false

autonomy_contract:
  human_approval_in_normal_path: false
  finish_work_required: true
  policy_decision_required_for_promotion: true
  unresolved_action: quarantine_and_create_remediation_work
  policy_failure_action: fail_closed
